<router-outlet></router-outlet>

<!-- Modal Visor (popups configurables, se activa solo en /home) -->
<app-modal-visor></app-modal-visor>

<!-- UI TOAST -->
@if (toast().open) {
  <div class="ui-toast-wrap" role="status" aria-live="polite">
    <div [class]="'ui-toast ' + toast().type">
      <div class="ui-toast__icon" aria-hidden="true">
        @switch (toast().type) {
          @case ('success') {
            <i class="fa-solid fa-circle-check"></i>
          }
          @case ('warning') {
            <i class="fa-solid fa-triangle-exclamation"></i>
          }
          @case ('error') {
            <i class="fa-solid fa-circle-xmark"></i>
          }
          @case ('info') {
            <i class="fa-solid fa-circle-info"></i>
          }
        }
      </div>

      <div class="ui-toast__content">
        <div class="ui-toast__title">{{ toast().title }}</div>
        <div class="ui-toast__text">{{ toast().message }}</div>
      </div>

      <button
        class="ui-icon-btn ui-toast__close"
        type="button"
        aria-label="Cerrar notificación"
        (click)="hideToast()"
      >
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </div>
  </div>
}
