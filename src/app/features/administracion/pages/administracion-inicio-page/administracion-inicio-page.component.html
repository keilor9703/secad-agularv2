<section class="admin-hub" aria-labelledby="admin-hub-title">
  <app-ui-page-header
    eyebrow="Administración central"
    title="Centro de administración"
    description="Acceda a las herramientas de seguridad, navegación y configuración institucional."
    icon="fa-solid fa-table-cells-large"
    headingId="admin-hub-title"
    [minimizable]="false"
  >
    <div
      page-header-actions
      class="admin-hub__summary"
      aria-label="Resumen del centro administrativo"
    >
      <app-ui-chip
        appearance="glass"
        size="xs"
        icon="fa-solid fa-layer-group"
        [value]="moduleCount()"
        label="módulos"
      />
      <app-ui-chip
        appearance="glass"
        size="xs"
        icon="fa-solid fa-shield-halved"
        label="Acceso administrativo"
      />
    </div>
  </app-ui-page-header>

  <section class="admin-catalog" aria-labelledby="admin-catalog-title">
    <app-ui-section-header
      appearance="boxed"
      eyebrow="Herramientas disponibles"
      title="Módulos de gestión"
      description="Seleccione una opción para continuar; cada módulo conserva su proceso independiente."
      icon="fa-solid fa-compass"
      headingId="admin-catalog-title"
    >
      <app-ui-chip
        header-actions
        appearance="soft"
        variant="info"
        size="xs"
        icon="fa-solid fa-folder-tree"
        [value]="areaCount()"
        label="áreas"
      />
    </app-ui-section-header>

    <div class="admin-catalog__body">
      <div class="admin-catalog__guide">
        <span class="admin-catalog__guide-icon" aria-hidden="true">
          <i class="fa-solid fa-circle-info"></i>
        </span>
        <div>
          <strong>Gestión organizada por responsabilidad</strong>
          <p>Los accesos se presentan sin alterar su ruta, permisos ni comportamiento actual.</p>
        </div>
      </div>

      <div class="admin-catalog__grid">
        @for (site of sites(); track site.route; let position = $index) {
          <app-admin-module-card [site]="site" [sequence]="position + 1" />
        }
      </div>
    </div>
  </section>
</section>
