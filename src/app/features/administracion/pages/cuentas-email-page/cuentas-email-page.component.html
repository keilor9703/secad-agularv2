<div class="ce-page">

  <app-ui-page-header
    title="Cuentas SMTP — Correo saliente"
    icon="fa-solid fa-at"
    description="Cuentas desde las que el sistema envía correo institucional. Cada cuenta
                 pertenece a un grupo del organigrama COEST y solo los usuarios autorizados
                 pueden enviar en su nombre."
    [minimizable]="false"
  />

  <div class="ce-grid">

    <!-- ─────────────────────────────  Formulario  ───────────────────────── -->
    <section class="ce-form-card">
      <app-ui-section-header
        [title]="editando() ? 'Actualizar cuenta' : 'Registrar nueva cuenta'"
        [description]="editando() ? form.controls.nombreCuenta.value : 'Los parámetros del servidor se aplican automáticamente.'"
        [icon]="editando() ? 'fa-solid fa-pen-to-square' : 'fa-solid fa-plus-circle'"
      />

      <form [formGroup]="form" class="ce-form" (ngSubmit)="guardar()">
        <app-ui-select
          formControlName="idDominioGrupo"
          label="Grupo dueño (organigrama COEST)"
          placeholder="Seleccione el grupo"
          [options]="opcionesGrupo()"
          [error]="errorGrupo()"
          required
        />

        <app-ui-input
          formControlName="nombreCuenta"
          label="Nombre identificador de la cuenta"
          placeholder="Ej: Prensa COEST"
          [maxlength]="100"
          [error]="errorNombre()"
          required
        />

        <app-ui-input
          formControlName="email"
          label="Email de la cuenta"
          type="email"
          placeholder="ejemplo@ponal.gov.co"
          [maxlength]="150"
          [error]="errorEmail()"
          required
        />

        <app-ui-input
          formControlName="claveSmtp"
          label="Contraseña SMTP (o de aplicación)"
          type="password"
          autocomplete="new-password"
          placeholder="••••••••"
          [hint]="editando() ? 'Se conserva la contraseña guardada si no la cambia.' : ''"
        />

        <app-ui-select
          formControlName="vigente"
          label="Estado de la cuenta"
          [options]="opcionesEstado"
          [clearable]="false"
          [searchable]="false"
        />

        <app-ui-file-upload
          label="Imagen de encabezado del correo"
          accept=".jpg,.jpeg,.png,.webp"
          buttonText="Seleccionar imagen"
          emptyText="Sin imagen de encabezado"
          icon="fa-solid fa-image"
          hint="JPG, PNG o WEBP · máx. 3 MB · se muestra en la parte superior de cada correo enviado."
          [allowedExtensions]="['jpg', 'jpeg', 'png', 'webp']"
          [maxSizeBytes]="maxEncabezadoBytes"
          [fileName]="nombreImagenEncabezado()"
          [loading]="subiendoImagenEncabezado()"
          (fileSelected)="onImagenEncabezado($event)"
          (clearRequested)="quitarImagenEncabezado()"
          (validationError)="onErrorImagenEncabezado($event)"
        />

        @if (imagenEncabezadoPreview()) {
          <figure class="ce-preview">
            <img [src]="imagenEncabezadoPreview()" alt="Vista previa del encabezado del correo" />
            <figcaption>Así se verá el encabezado de los correos de esta cuenta.</figcaption>
          </figure>
        }

        <div class="ce-form__actions">
          <app-ui-button variant="secondary" type="button" (buttonClick)="nuevo()">
            {{ editando() ? 'Cancelar edición' : 'Limpiar' }}
          </app-ui-button>
          <app-ui-button
            variant="primary"
            type="submit"
            icon="fa-solid fa-floppy-disk"
            [disabled]="saving()"
          >
            {{ saving() ? 'Procesando…' : 'Guardar configuración' }}
          </app-ui-button>
        </div>
      </form>
    </section>

    <!-- ─────────────────────────────  Listado  ──────────────────────────── -->
    <section class="ce-list-card">
      <app-ui-section-header
        title="Cuentas configuradas"
        icon="fa-solid fa-list-check"
      />

      <app-ui-table
        [columns]="columnasCuentas"
        [rows]="listaCuentas()"
        [actions]="accionesCuentas"
        [loading]="loading()"
        loadingMessage="Cargando cuentas…"
        emptyMessage="No hay cuentas SMTP registradas."
        actionDisplay="row-hover"
        actionsPosition="right"
        actionMenuLabel="Acciones de la cuenta"
        (actionClick)="onAccionCuenta($event)"
      />
    </section>
  </div>

  <!-- ───────────────────────────  Autorizaciones  ───────────────────────── -->
  @if (cuentaAutorizacion(); as cuenta) {
    <section class="ce-auth-card">
      <app-ui-section-header
        title="Usuarios autorizados"
        [description]="cuenta.nombreCuenta + ' · ' + cuenta.email"
        icon="fa-solid fa-user-shield"
      >
        <app-ui-button
          header-actions
          variant="secondary"
          icon="fa-solid fa-xmark"
          (buttonClick)="cerrarAutorizaciones()"
        >
          Cerrar
        </app-ui-button>
      </app-ui-section-header>

      <app-ui-search-input
        label="Buscar usuario (username, identificación o nombre)"
        placeholder="Ej: jlopez o 12345678"
        buttonText="Buscar"
        hint="Mínimo 3 caracteres."
        [disabled]="loadingBusquedaUsuarios() || savingAutorizacion()"
        (search)="buscarUsuarios($event)"
        (cleared)="limpiarBusqueda()"
      />

      @if (busquedaHecha()) {
        <app-ui-table
          class="ce-auth-card__tabla"
          [columns]="columnasBusqueda"
          [rows]="resultadosUsuarios()"
          [actions]="accionesBusqueda"
          [loading]="loadingBusquedaUsuarios()"
          loadingMessage="Buscando usuarios…"
          emptyMessage="Ningún usuario coincide con la búsqueda."
          variant="plain"
          actionsPosition="right"
          actionMenuLabel="Acciones del usuario"
          (actionClick)="onAccionBusqueda($event)"
        />
      }

      <app-ui-section-header
        title="Autorizados actuales"
        icon="fa-solid fa-users"
      />

      <app-ui-table
        [columns]="columnasAutorizados"
        [rows]="listaAutorizados()"
        [actions]="accionesAutorizados"
        [loading]="loadingAutorizados()"
        loadingMessage="Cargando autorizados…"
        emptyMessage="No hay usuarios autorizados para esta cuenta."
        variant="plain"
        actionsPosition="right"
        actionMenuLabel="Acciones de la autorización"
        (actionClick)="onAccionAutorizado($event)"
      />
    </section>
  }
</div>
