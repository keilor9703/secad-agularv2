<section class="user-admin-page" *ngIf="visible">
  <div class="ui-panel">
    <div class="ui-panel__head">
      <div class="ui-panel__title">
        <i class="fa-solid fa-id-card"></i>
        Administración de Usuarios
      </div>

      <div class="ui-panel__actions ui-window-controls">
        <button
          class="ui-icon-btn ui-win-btn is-min"
          type="button"
          title="Minimizar"
          (click)="toggleMinimize()"
        >
          <i class="fa-solid fa-minus"></i>
        </button>

        <button
          class="ui-icon-btn ui-win-btn is-close"
          type="button"
          title="Cerrar"
          (click)="closePanel()"
        >
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </div>

    <div class="ui-panel__body" *ngIf="!minimized">
      <app-usuario-form
        [user]="user"
        [rolesCatalogo]="rolesCatalogo"
        [loading]="loading"
        [savingRole]="savingRole"
        [deletingRoleId]="deletingRoleId"
        [superAdministradorRolId]="superAdministradorRolId"
        (consultar)="consultarUsuario($event)"
        (guardarDatos)="guardarDatosUsuario($event)"
        (nuevoUsuario)="prepararNuevoUsuario()"
        (guardarRol)="guardarRoles($event)"
        (eliminarRol)="eliminarRol($event)"
      ></app-usuario-form>
    </div>
  </div>

  <app-usuarios-table
    [usuarios]="usuariosListadoPaginado"
    [loading]="loadingListado"
    [isSearchMode]="isSearchMode"
    [minSearchChars]="minSearchChars"
    [currentPage]="currentPage"
    [totalPaginas]="totalPaginasListado"
    [totalUsuarios]="totalUsuariosListado"
    [canGoPrev]="canGoPrevListado()"
    [canGoNext]="canGoNextListado()"
    [searchTerm]="searchNombreListado"
    (buscar)="onSearchNombreListadoChange($event)"
    (paginaAnterior)="prevPaginaListado()"
    (paginaSiguiente)="nextPaginaListado()"
    (editar)="editarDesdeListado($event)"
    (eliminar)="abrirModalEliminarUsuario($event)"
  ></app-usuarios-table>

  <div class="modal-backdrop" *ngIf="showDeleteUserModal">
    <div class="modal-card">
      <h3>Confirmar eliminación de usuario</h3>

      <p>
        Para eliminar el usuario <strong>{{ deletingTarget?.username }}</strong
        >, escribe <strong>ELIMINAR</strong>.
      </p>

      <form [formGroup]="deleteConfirmForm" (ngSubmit)="confirmarEliminarUsuario()">
        <input
          class="ui-control"
          type="text"
          formControlName="confirmacion"
          placeholder="Escribe ELIMINAR"
        />

        <small
          class="field-error"
          *ngIf="
            deleteConfirmForm.controls.confirmacion.invalid &&
            deleteConfirmForm.controls.confirmacion.touched
          "
        >
          Este campo es obligatorio.
        </small>

        <div class="tab-actions">
          <button
            class="ui-btn secondary"
            type="button"
            (click)="cerrarModalEliminarUsuario()"
            [disabled]="deletingUser"
          >
            Cancelar
          </button>

          <button
            class="ui-btn primary"
            type="submit"
            [disabled]="deletingUser || deleteConfirmForm.invalid"
          >
            {{ deletingUser ? 'Eliminando...' : 'Confirmar eliminación' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</section>
