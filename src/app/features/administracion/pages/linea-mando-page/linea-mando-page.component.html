<section class="linea-mando-page">
  <app-ui-page-header
    eyebrow="Administración central"
    title="Línea de mando"
    description="Configure responsables, jerarquía y disponibilidad de la estructura institucional."
    icon="fa-solid fa-people-arrows"
    [minimized]="headerMinimized()"
    (minimizedChange)="headerMinimized.set($event)"
  >
    <div class="linea-mando-page__header-chips" page-header-actions>
      <app-ui-chip
        size="sm"
        label="activos"
        [value]="activeCount()"
        variant="info"
        appearance="glass"
        icon="fa-solid fa-user-shield"
      />
      @if (inactiveCount() > 0) {
        <app-ui-chip
          size="sm"
          label="inactivos"
          [value]="inactiveCount()"
          variant="neutral"
          appearance="glass"
        />
      }
    </div>
  </app-ui-page-header>

  @if (!headerMinimized()) {
    <div class="linea-mando-page__summary" aria-label="Resumen de la configuración">
      <div>
        <span class="summary-icon is-primary"><i class="fa-solid fa-ranking-star"></i></span>
        <p>
          <strong>{{ activeCount() }}</strong
          ><small>posiciones activas</small>
        </p>
      </div>
      <div>
        <span class="summary-icon is-info"><i class="fa-solid fa-arrow-down-1-9"></i></span>
        <p>
          <strong>{{ nextOrder() }}</strong
          ><small>próximo orden sugerido</small>
        </p>
      </div>
      <div>
        <span class="summary-icon is-accent"><i class="fa-solid fa-shield-halved"></i></span>
        <p><strong>Controlada</strong><small>una persona por posición</small></p>
      </div>
    </div>

    <app-ui-section-header
      eyebrow="Gestión jerárquica"
      title="Integrantes y posiciones"
      description="Consulte funcionarios institucionales y organice visualmente la cadena de mando."
      icon="fa-solid fa-sitemap"
      [compact]="true"
    />

    <div class="linea-mando-page__workspace">
      <div id="linea-mando-editor" class="linea-mando-page__editor">
        <app-linea-mando-form
          [value]="editorValue()"
          [editing]="isEditing()"
          [searching]="searching()"
          [saving]="saving()"
          (searchRequested)="searchEmployee($event)"
          (saveRequested)="saveRecord($event)"
          (cancelRequested)="closeEditor()"
          (validationWarning)="showFormWarning($event)"
        />
      </div>

      <app-linea-mando-list
        [rows]="records()"
        [loading]="loading()"
        [selectedId]="editingId()"
        (editRequested)="editRecord($event)"
        (removeRequested)="removeRecord($event)"
      />
    </div>
  }
</section>
