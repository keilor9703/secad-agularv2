<section class="roles-admin-page">
  <app-ui-page-header
    eyebrow="Administración central"
    title="Administración de Roles"
    description="Gestione perfiles de acceso y los menús habilitados para cada rol."
    icon="fa-solid fa-user-shield"
    headingId="roles-admin-title"
    [minimized]="minimized()"
    (minimizedChange)="minimized.set($event)"
  >
    <div page-header-actions class="roles-admin-summary" aria-label="Resumen de roles">
      <app-ui-chip
        appearance="glass"
        size="xs"
        icon="fa-solid fa-users-gear"
        [value]="roleCount()"
        label="roles"
      />
      <app-ui-chip
        appearance="glass"
        size="xs"
        icon="fa-solid fa-circle-check"
        [value]="activeRoleCount()"
        label="activos"
      />
    </div>
  </app-ui-page-header>

  @if (!minimized()) {
    <article class="roles-admin-content" aria-labelledby="roles-admin-title">
      <app-ui-panel-header
        appearance="soft"
        title="Control de acceso centralizado"
        description="Seleccione un rol para consultar sus permisos y administre por separado su definición y navegación."
        icon="fa-solid fa-key"
        headingId="roles-access-title"
      >
        <app-ui-button
          panel-header-actions
          class="roles-admin-create"
          size="sm"
          variant="primary"
          icon="fa-solid fa-plus"
          [hideTextOnMobile]="true"
          backgroundColor="var(--policia-acento, #c8ff00)"
          textColor="#102342"
          borderColor="rgba(149, 191, 0, 0.72)"
          iconColor="#102342"
          [disabled]="loadingRoles()"
          ariaLabel="Crear un rol"
          (buttonClick)="startCreate()"
        >
          Nuevo rol
        </app-ui-button>
      </app-ui-panel-header>

      <div class="roles-admin-content__body">
        @if (editorVisible()) {
          <section class="role-editor-window">
            <app-ui-section-header
              [eyebrow]="editingRole() ? 'EDICIÓN DE PERFIL' : 'NUEVO PERFIL'"
              [title]="editingRole() ? 'Editar rol' : 'Crear rol'"
              [description]="
                editingRole()
                  ? 'Actualice el rol seleccionado y revise su estructura de navegación.'
                  : 'Registre la identidad y disponibilidad del nuevo perfil de acceso.'
              "
              [icon]="editingRole() ? 'fa-solid fa-user-pen' : 'fa-solid fa-user-plus'"
              headingId="role-editor-title"
            >
              <app-ui-button
                header-actions
                size="sm"
                variant="ghost"
                icon="fa-solid fa-xmark"
                [iconOnly]="true"
                ariaLabel="Cerrar editor de rol"
                title="Cerrar editor"
                backgroundColor="rgba(255, 255, 255, 0.72)"
                borderColor="rgba(8, 166, 203, 0.24)"
                iconColor="#174f77"
                [disabled]="savingRole()"
                (buttonClick)="closeEditor()"
              />
            </app-ui-section-header>

            <div class="role-editor-window__body" [class.is-create]="editingRole() === null">
              <div class="role-editor-window__form">
                <app-role-admin-form
                  [editingRole]="editingRole()"
                  [embedded]="true"
                  [saving]="savingRole()"
                  [resetVersion]="formResetVersion()"
                  (saveRequested)="saveRole($event)"
                  (cancelRequested)="closeEditor()"
                />
              </div>

              @if (editingRole()) {
                <app-role-menu-tree
                  [menus]="roleMenus()"
                  [loading]="loadingRoleMenus()"
                  [removingMenuId]="removingMenuId()"
                  (removeRequested)="removeMenu($event)"
                />
              } @else {
                <app-role-access-summary [roles]="roles()" [menus]="allMenus()" />
              }
            </div>
          </section>
        } @else {
          <div class="roles-admin-workspace">
            <app-role-admin-list
              [roles]="roles()"
              [loading]="loadingRoles()"
              [selectedRoleId]="selectedRoleId()"
              [editingRoleId]="editingRole()?.id ?? null"
              [processingRoleId]="processingRoleId()"
              (editRequested)="editRole($event)"
              (permissionsRequested)="selectRole($event)"
              (stateRequested)="changeRoleState($event)"
            />

            <app-role-menu-permissions
              [selectedRole]="selectedRole()"
              [assignedMenus]="roleMenus()"
              [availableMenuOptions]="availableMenuOptions()"
              [loading]="loadingRoleMenus()"
              [loadingCatalog]="loadingMenus()"
              [saving]="savingRoleMenu()"
              [removingMenuId]="removingMenuId()"
              (assignRequested)="assignMenu($event)"
              (removeRequested)="removeMenu($event)"
            />
          </div>
        }
      </div>
    </article>
  }
</section>
