<section class="formularios-page" *ngIf="visible">
  <div class="ui-panel">
    <div class="ui-panel__head">
      <div class="ui-panel__title">
        <i class="fa-solid fa-clipboard-list"></i>
        Guía visual de formularios
      </div>

      <div class="ui-panel__actions ui-window-controls">
        <button
          class="ui-icon-btn ui-win-btn is-min"
          type="button"
          title="Minimizar"
          (click)="toggleMinimize()"
        >
          <i class="fa-solid fa-minus"></i>
        </button>

        <button
          class="ui-icon-btn ui-win-btn is-close"
          type="button"
          title="Cerrar"
          (click)="closePanel()"
        >
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </div>

    <div class="ui-panel__body" *ngIf="!minimized">
      <form class="demo-form" [formGroup]="formularioDemo" (ngSubmit)="guardar()">
        <article class="form-section">
          <h3>Inputs básicos</h3>

          <div class="form-grid">
            <div class="col-6">
              <app-ui-input
                formControlName="nombres"
                label="Nombres"
                placeholder="Ingrese nombres"
                [required]="true"
                [maxlength]="80"
                [error]="error('nombres')"
              ></app-ui-input>
            </div>

            <div class="col-6">
              <app-ui-input
                formControlName="telefono"
                label="Teléfono"
                placeholder="Ingrese teléfono"
                icon="fa-solid fa-phone"
                hint="Ejemplo: 3001234567"
                [required]="true"
                [error]="error('telefono')"
              ></app-ui-input>
            </div>

            <div class="col-6">
              <app-ui-input
                formControlName="correo"
                label="Correo electrónico"
                placeholder="correo@dominio.com"
                type="email"
                icon="fa-solid fa-envelope"
                [required]="true"
                [error]="error('correo')"
              ></app-ui-input>
            </div>
          </div>
        </article>

        <article class="form-section">
          <h3>Buscadores y selects</h3>

          <div class="form-grid">
            <div class="col-12">
              <app-ui-search-input
                formControlName="criterioBusqueda"
                label="Buscar usuario"
                placeholder="Buscar por nombre, identificación o correo"
                buttonText="Buscar"
                (search)="buscar($event)"
              ></app-ui-search-input>
            </div>

            <div class="col-6">
              <app-ui-select
                formControlName="unidad"
                label="Unidad"
                placeholder="Seleccione una unidad"
                searchPlaceholder="Buscar unidad..."
                [required]="true"
                [options]="unidadOptions"
                [error]="error('unidad')"
              ></app-ui-select>
            </div>

            <div class="col-6">
              <app-ui-select
                formControlName="ciudad"
                label="Ciudad"
                placeholder="Seleccione una ciudad"
                searchPlaceholder="Buscar ciudad..."
                [required]="true"
                [options]="ciudadOptions"
                [error]="error('ciudad')"
              ></app-ui-select>
            </div>
          </div>
        </article>

        <article class="form-section">
          <h3>Fecha, hora y texto largo</h3>

          <div class="form-grid">
            <div class="col-4">
              <app-ui-input
                formControlName="fechaNacimiento"
                label="Fecha de nacimiento"
                type="date"
                icon="fa-solid fa-calendar-days"
                [required]="true"
                [error]="error('fechaNacimiento')"
              ></app-ui-input>
            </div>

            <div class="col-4">
              <app-ui-input
                formControlName="horaInicio"
                label="Hora inicio"
                type="time"
                icon="fa-solid fa-clock"
                [required]="true"
                [error]="error('horaInicio')"
              ></app-ui-input>
            </div>

            <div class="col-4">
              <app-ui-input
                formControlName="fechaHoraCita"
                label="Fecha y hora de cita"
                type="datetime-local"
                icon="fa-solid fa-calendar-check"
                [required]="true"
                [error]="error('fechaHoraCita')"
              ></app-ui-input>
            </div>

            <div class="col-12">
              <app-ui-input
                formControlName="observacion"
                label="Observación"
                placeholder="Ingrese observación"
                [rows]="4"
                [maxlength]="500"
                [multiline]="true"
                hint="Máximo 500 caracteres."
                [error]="error('observacion')"
              ></app-ui-input>
            </div>
          </div>
        </article>

        <div class="form-actions">
          <app-ui-button type="submit" variant="primary" icon="fa-solid fa-floppy-disk"
            >Guardar</app-ui-button
          >
          <app-ui-button
            type="button"
            variant="secondary"
            icon="fa-solid fa-eraser"
            (buttonClick)="limpiar()"
            >Limpiar</app-ui-button
          >
          <app-ui-button
            type="button"
            variant="outline"
            icon="fa-solid fa-ban"
            (buttonClick)="cancelar()"
            >Cancelar</app-ui-button
          >
        </div>
      </form>
    </div>
  </div>

  <app-funcionarios-table-demo></app-funcionarios-table-demo>

  <div class="ui-panel">
    <div class="ui-panel__head">
      <div class="ui-panel__title">
        <i class="fa-solid fa-code"></i>
        JSON del formulario
      </div>
    </div>

    <div class="ui-panel__body">
      <pre class="json-preview">{{ submittedJson || (formularioDemo.getRawValue() | json) }}</pre>
    </div>
  </div>
</section>
