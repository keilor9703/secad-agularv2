<div class="cs-page">

  <app-ui-page-header
    title="Proveedor SMS"
    icon="fa-solid fa-comment-sms"
    description="Quién envía los SMS salientes: el enlace de videollamada al ciudadano, entre otros. Cambiar de proveedor no obliga a reiniciar el servidor."
    [minimizable]="false"
  />

  @if (loading()) {
    <app-ui-spinner label="Cargando configuración…" contained />
  } @else {

    <!-- ═══ Configuración ══════════════════════════════════════════════════ -->
    <section class="cs-card">
      <app-ui-section-header
        title="Configuración del proveedor"
        icon="fa-solid fa-plug-circle-check"
        appearance="divider"
      />

      <form [formGroup]="form" class="cs-form">
        <app-ui-select
          class="cs-form__medio"
          formControlName="proveedor"
          label="Proveedor"
          [options]="opcionesProveedor"
          [clearable]="false"
          [searchable]="false"
          required
        />

        <app-ui-input
          formControlName="baseUrl"
          label="URL base"
          [placeholder]="placeholderUrl()"
          [hint]="proveedorSeleccionado().baseUrlPorDefecto
                    ? 'Déjelo vacío para usar ' + proveedorSeleccionado().baseUrlPorDefecto
                    : ''"
        />

        <app-ui-input
          formControlName="apiKey"
          label="API Key"
          type="password"
          autocomplete="new-password"
          placeholder="Pegue aquí la nueva API Key…"
          [hint]="pistaApiKey()"
        />

        @if (proveedorSeleccionado().usaSender) {
          <app-ui-input
            formControlName="sender"
            label="Remitente (sender)"
            placeholder="Vacío = el remitente por defecto de la cuenta"
            hint="Opcional. Solo lo admiten los proveedores que permiten fijar el remitente."
          />
        }
      </form>

      <footer class="cs-pie">
        @if (ultimaModificacion(); as cuando) {
          <p class="cs-meta">Última modificación: {{ cuando }}</p>
        }
        <app-ui-button
          variant="primary"
          icon="fa-solid fa-floppy-disk"
          [loading]="saving()"
          [disabled]="saving()"
          (buttonClick)="guardar()"
        >Guardar configuración</app-ui-button>
      </footer>
    </section>

    <!-- ═══ Prueba de envío ════════════════════════════════════════════════ -->
    <section class="cs-card">
      <app-ui-section-header
        title="Probar envío"
        icon="fa-solid fa-vial"
        description="Envía un SMS con la configuración ya guardada, para confirmar que el proveedor quedó bien conectado."
        appearance="divider"
      />

      <div class="cs-prueba">
        <app-ui-input
          class="cs-prueba__num"
          label="Número de teléfono"
          placeholder="Ej: 3001234567"
          [ngModel]="telefonoPrueba()"
          (ngModelChange)="telefonoPrueba.set($event)"
        />
        <app-ui-button
          variant="secondary"
          icon="fa-solid fa-paper-plane"
          [loading]="probando()"
          [disabled]="probando()"
          (buttonClick)="probarEnvio()"
        >Enviar prueba</app-ui-button>
      </div>
    </section>
  }
</div>
