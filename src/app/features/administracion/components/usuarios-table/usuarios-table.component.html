<section class="users-existing">
  <form class="users-existing__filters" [formGroup]="searchForm">
    <app-ui-search-input
      formControlName="nombre"
      label="Buscar por nombre"
      placeholder="Escribe un nombre o usuario"
      buttonText="Filtrar"
      icon="fa-solid fa-magnifying-glass"
      [clearable]="true"
      [hint]="'La búsqueda se activa desde ' + minSearchChars + ' caracteres.'"
      (search)="onSearchSubmit($event)"
      (cleared)="onSearchClear()"
    ></app-ui-search-input>
  </form>

  <div class="users-existing__loading" *ngIf="loading; else tableTpl">
    <i class="fa-solid fa-circle-notch fa-spin" aria-hidden="true"></i>
    <span>Consultando usuarios...</span>
  </div>

  <ng-template #tableTpl>
    <app-ui-table
      title="Usuarios existentes"
      titleIcon="fa-solid fa-users"
      actionMenuLabel="Acciones del usuario"
      [columns]="columns"
      [rows]="usuarios"
      [actions]="actions"
      [total]="totalUsuarios"
      [page]="currentPage"
      [pageSize]="pageSize"
      [pageSizeOptions]="[pageSize]"
      [emptyMessage]="tableEmptyMessage"
      [stickyActions]="true"
      (pageChange)="cambiarPagina.emit($event)"
      (actionClick)="handleAction($event)"
    ></app-ui-table>
  </ng-template>
</section>
