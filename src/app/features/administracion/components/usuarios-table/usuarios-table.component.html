<section class="users-existing">
  <app-ui-table
    class="users-existing__table"
    title="Usuarios existentes"
    titleIcon="fa-solid fa-users"
    actionMenuLabel="Acciones del usuario"
    [columns]="columns"
    [rows]="loading ? [] : usuarios"
    [actions]="actions"
    [total]="totalUsuarios"
    [page]="currentPage"
    [pageSize]="pageSize"
    [pageSizeOptions]="[5, 10, 20, 50]"
    [emptyMessage]="tableEmptyMessage"
    [stickyActions]="true"
    (pageChange)="cambiarPagina.emit($event)"
    (pageSizeChange)="cambiarTamanoPagina.emit($event)"
    (actionClick)="handleAction($event)"
  >
    <form table-toolbar class="users-existing__filters" [formGroup]="searchForm">
      <app-ui-search-input
        formControlName="nombre"
        label="Buscar por nombre"
        placeholder="Escribe un nombre o usuario"
        buttonText="Filtrar"
        icon="fa-solid fa-magnifying-glass"
        [clearable]="true"
        [hint]="'La búsqueda se activa desde ' + minSearchChars + ' caracteres.'"
        (search)="onSearchSubmit($event)"
        (cleared)="onSearchClear()"
      ></app-ui-search-input>
    </form>
  </app-ui-table>

  <ng-template #rolesCell let-row="row">
    <app-usuario-roles-dropdown
      [roles]="row.rol"
      [vencimientos]="row.fechaFinRol || ''"
    ></app-usuario-roles-dropdown>
  </ng-template>
</section>
