<article class="access-section">
  <app-ui-section-header
    eyebrow="ROLES Y PERMISOS"
    title="Control de acceso"
    description="Roles vigentes asociados al usuario consultado."
    icon="fa-solid fa-key"
    headingId="usuarios-roles-title"
    [compact]="true"
  >
    <div header-actions class="access-section__actions">
      <app-ui-chip
        class="access-section__status"
        [value]="roles.length"
        label="vigentes"
        variant="success"
        appearance="outline"
        size="xs"
        [dot]="true"
      />

      <app-ui-button
        variant="primary"
        size="sm"
        icon="fa-solid fa-plus"
        [hideTextOnMobile]="true"
        ariaLabel="Agregar un rol al usuario"
        (buttonClick)="agregarRol.emit()"
      >
        Agregar rol
      </app-ui-button>
    </div>
  </app-ui-section-header>

  <div class="access-section__content">
    <!-- La sección aporta la tarjeta exterior; ui-table permanece embebida. -->
    <app-ui-table
      variant="plain"
      paginationVariant="numbered"
      actionDisplay="row-hover"
      actionsPosition="right"
      embedded
      emptyMessage="El usuario no tiene roles asignados actualmente."
      [variant]="roleTableVariant()"
      [actionDisplay]="roleActionDisplay()"
      [actionsPosition]="roleActionsPosition()"
      [columns]="roleColumns"
      [rows]="roles"
      [actions]="roleActions"
      [total]="roles.length"
      [paginationShowPageSize]="false"
      [paginationShowSummary]="false"
      [showPagination]="true"
      [paginationMaxVisiblePages]="5"
      labelledBy="usuarios-roles-title"
      [showRecordBadge]="false"
      [pageSize]="5"
      [bodyFontSize]="12"
      bodyFontWeight="normal"
      [rowPadding]="7"
      headerTextColor="#263247"
      actionMenuLabel="Acciones del rol asignado"
      (actionClick)="handleRoleAction($event)"
    ></app-ui-table>
  </div>
</article>

<app-ui-modal
  [open]="showAddRoleForm"
  [title]="roleModalTitle"
  [subtitle]="roleModalSubtitle"
  icon="fa-solid fa-shield-halved"
  size="lg"
  (closeRequested)="cancelarRol.emit()"
>
  <div modal-body class="role-modal-body" [formGroup]="rolForm">
    @if (showAddRoleForm) {
      <div class="ui-grid role-modal-grid">
        <div class="ui-col-6">
          <app-ui-select
            formControlName="rolId"
            label="Rol"
            placeholder="Seleccione un rol"
            [options]="rolOptions"
            [required]="true"
            [error]="getRoleError('rolId')"
          ></app-ui-select>
        </div>

        <div class="ui-col-6">
          <app-ui-date-time-picker
            formControlName="fechaFin"
            label="Fecha fin"
            mode="date"
            icon="fa-solid fa-calendar-days"
            [minDate]="minimumRoleEndDate()"
            [required]="true"
            [error]="getRoleError('fechaFin')"
          ></app-ui-date-time-picker>
        </div>

        <div class="ui-col-12">
          <app-ui-input
            formControlName="justificacion"
            label="Justificación"
            placeholder="Motivo de la asignación"
            [maxlength]="500"
            [rows]="3"
            [multiline]="true"
            [required]="true"
            [error]="getRoleError('justificacion')"
          ></app-ui-input>
        </div>
      </div>
    }
  </div>

  <div modal-actions class="role-modal-actions">
    <app-ui-button
      type="button"
      variant="secondary"
      icon="fa-solid fa-ban"
      [disabled]="savingRole"
      (buttonClick)="cancelarRol.emit()"
    >
      Cancelar
    </app-ui-button>

    <app-ui-button
      type="button"
      variant="primary"
      icon="fa-solid fa-floppy-disk"
      [disabled]="savingRole || rolForm.invalid"
      [loading]="savingRole"
      (buttonClick)="guardarRol.emit()"
    >
      {{ savingRole ? 'Guardando...' : editingRole ? 'Actualizar cambios' : 'Guardar rol' }}
    </app-ui-button>
  </div>
</app-ui-modal>
