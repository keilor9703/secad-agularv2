<section class="users-existing" [attr.aria-labelledby]="tableTitleId">
  <!--
    Patrón “Cabecera suave con contenido”: la cabecera describe y controla la
    sección; ui-table se embebe debajo para evitar una segunda tarjeta visual.
  -->
  <article class="users-existing__panel">
    <app-ui-panel-header
      class="users-existing__header"
      title="Usuarios existentes"
      description="Consulte y administre los usuarios registrados en el sistema."
      icon="fa-solid fa-users-gear"
      appearance="soft"
      [headingId]="tableTitleId"
    >
      <div
        panel-header-actions
        class="users-existing__header-actions"
        aria-label="Resumen y búsqueda de usuarios"
      >
        <app-ui-chip
          class="users-existing__count"
          [value]="totalUsuarios"
          label="usuarios"
          variant="info"
          appearance="soft"
          size="xs"
          icon="fa-solid fa-user-group"
        />

        <form
          class="users-existing__filters"
          role="search"
          aria-label="Buscar usuarios"
          [formGroup]="searchForm"
        >
          <app-ui-search-input
            formControlName="nombre"
            ariaLabel="Buscar por nombre o usuario empresarial"
            placeholder="Buscar usuario..."
            icon="fa-solid fa-magnifying-glass"
            [showButton]="false"
            [clearable]="true"
            [controlSize]="alturaCompacta"
          ></app-ui-search-input>
        </form>
      </div>
    </app-ui-panel-header>

    <div class="users-existing__content">
      <app-ui-table
        class="users-existing__table"
        [embedded]="true"
        [labelledBy]="tableTitleId"
        actionMenuLabel="Acciones del usuario"
        dataMode="external"
        variant="institutional"
        actionDisplay="row-hover"
        mobileActionDisplay="menu"
        actionsPosition="right"
        [headerColor]="tableHeaderColor()"
        [headerColorMiddle]="tableHeaderColorMiddle()"
        [headerColorEnd]="tableHeaderColorEnd()"
        headerTextColor="#ffffff"
        paginationVariant="numbered"
        [paginationMaxVisiblePages]="5"
        [paginationShowSummary]="true"
        [paginationShowPageSize]="true"
        [columns]="columns"
        [rows]="usuarios"
        [rowAppearance]="resolveRowAppearance"
        [bodyFontSize]="12"
        bodyFontWeight="regular"
        bodyTextColor="#536b85"
        darkBodyTextColor="#e6edf7"
        [rowHeight]="44"
        [rowPadding]="8"
        [tableMinWidth]="720"
        [actions]="actions"
        [total]="totalUsuarios"
        [page]="currentPage"
        [pageSize]="pageSize"
        [pageSizeOptions]="[5, 10, 20, 50]"
        [emptyMessage]="tableEmptyMessage"
        [loading]="loading"
        loadingMessage="Consultando usuarios..."
        loadingSpinnerSize="lg"
        loadingSpinnerVariant="info"
        [stickyActions]="true"
        (pageChange)="cambiarPagina.emit($event)"
        (pageSizeChange)="cambiarTamanoPagina.emit($event)"
        (actionClick)="handleAction($event)"
      />
    </div>
  </article>

  <ng-template #rolesCell let-row="row">
    <app-usuario-roles-dropdown
      [roles]="row.rol"
      [vencimientos]="row.fechaFinRol || ''"
      [contextLabel]="row.identificacion || row.username"
    ></app-usuario-roles-dropdown>
  </ng-template>
</section>
