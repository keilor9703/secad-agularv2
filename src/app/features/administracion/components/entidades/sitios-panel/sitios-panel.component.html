<div class="sg-panel">

  <app-ui-section-header
    title="Sitios de grabación del CAD"
    icon="fa-solid fa-tower-cell"
    description="Las unidades policiales que operan en este CAD. Cada fuerza pertenece a una de
                 ellas, y es lo que mantiene separados los registros cuando dos unidades
                 comparten la misma sala."
  >
    <app-ui-button
      header-actions
      variant="secondary" appearance="ghost" icon="fa-solid fa-arrow-left"
      (buttonClick)="cerrado.emit()"
    >Volver a las fuerzas</app-ui-button>
    <app-ui-button
      header-actions
      variant="primary" icon="fa-solid fa-plus"
      (buttonClick)="abrirCreacion()"
    >Nuevo sitio</app-ui-button>
  </app-ui-section-header>

  <app-ui-table
    [columns]="columns"
    [rows]="sitios()"
    [actions]="acciones"
    [loading]="loading()"
    loadingMessage="Cargando sitios de grabación…"
    emptyMessage="Este CAD todavía no tiene sitios de grabación registrados."
    actionDisplay="row-hover"
    actionsPosition="right"
    actionMenuLabel="Acciones del sitio"
    (actionClick)="onAccion($event)"
  />

  <ng-template #celdaUnidad let-row="row">
    <strong>{{ row.descripcion }}</strong>
    @if (row.abreviatura) {
      <div class="sg-sigla">{{ row.abreviatura }}</div>
    }
  </ng-template>

</div>

<!-- ══════════════════════════════════════════════════════════════════════
     Crear / editar sitio
     ══════════════════════════════════════════════════════════════════════ -->
<app-ui-modal
  [open]="showModal()"
  [title]="modo() === 'crear' ? 'Nuevo sitio de grabación' : 'Editar sitio de grabación'"
  [icon]="modo() === 'crear' ? 'fa-solid fa-plus-circle' : 'fa-solid fa-pen-to-square'"
  size="md"
  (closeRequested)="cerrarModal()"
>
  <form modal-body [formGroup]="form" class="sg-form">

    <div class="sg-row">
      <app-ui-input
        class="sg-row__side"
        formControlName="consecutivo"
        label="Código"
        type="number"
        required
        [error]="errorConsecutivo()"
        [hint]="modo() === 'crear'
                  ? 'Debe coincidir con el que usa la planta telefónica.'
                  : 'No se puede cambiar: identifica al sitio en los registros históricos.'"
      />
      <app-ui-input
        class="sg-row__grow"
        formControlName="descripcion"
        label="Unidad policial"
        placeholder="Ej: Metropolitana de Barranquilla"
        [maxlength]="200"
        required
        [error]="errorDescripcion()"
      />
    </div>

    <div class="sg-row">
      <app-ui-input
        class="sg-row__side"
        formControlName="abreviatura"
        label="Sigla"
        placeholder="MEBAR"
        [maxlength]="20"
        hint="Como se nombra la unidad en la operación."
      />
      <app-ui-input
        class="sg-row__side"
        formControlName="codDane"
        label="Código DANE"
        placeholder="08001"
        [maxlength]="10"
        hint="Municipio de la unidad."
      />
      <app-ui-select
        class="sg-row__side"
        formControlName="vigente"
        label="Estado"
        [options]="opcionesVigencia"
        [clearable]="false"
        [searchable]="false"
      />
    </div>

    <app-ui-section-header
      title="Centro del mapa"
      icon="fa-solid fa-map-location-dot"
      description="Donde abre el mapa para la gente de esta unidad, en Recepción, Mapa de
                   Incidentes y GIS Estadístico. Se rellena solo por código DANE; complételo
                   a mano si su municipio no viene en la lista."
    />

    <div class="sg-row">
      <app-ui-input
        class="sg-row__side"
        formControlName="latitud"
        label="Latitud"
        type="number"
        placeholder="10.9685"
        [error]="errorCoordenadas()"
      />
      <app-ui-input
        class="sg-row__side"
        formControlName="longitud"
        label="Longitud"
        type="number"
        placeholder="-74.7813"
      />
      <app-ui-input
        class="sg-row__side"
        formControlName="zoomMapa"
        label="Zoom"
        type="number"
        hint="12-13 un municipio · 8-9 un departamento"
      />
    </div>

  </form>

  <div modal-actions class="sg-acciones">
    <app-ui-button
      variant="secondary"
      appearance="ghost"
      icon="fa-solid fa-xmark"
      (buttonClick)="cerrarModal()"
    >
      Cancelar
    </app-ui-button>
    <app-ui-button
      variant="primary"
      icon="fa-solid fa-floppy-disk"
      [loading]="saving()"
      [disabled]="saving()"
      (buttonClick)="guardar()"
    >
      {{ saving() ? 'Guardando…' : 'Guardar' }}
    </app-ui-button>
  </div>
</app-ui-modal>
