<article class="access-section">
  <header class="access-section__header">
    <div>
      <h3>Control de acceso</h3>
      <p>Roles vigentes asociados al usuario consultado.</p>
    </div>

    <app-ui-button variant="secondary" icon="fa-solid fa-plus" (buttonClick)="agregarRol.emit()">
      Agregar rol
    </app-ui-button>
  </header>

  <app-ui-table
    emptyMessage="El usuario no tiene roles asignados actualmente."
    [columns]="roleColumns"
    [rows]="roles"
    [actions]="roleActions"
    [total]="roles.length"
    [showPagination]="false"
    [stickyActions]="true"
    actionMenuLabel="Acciones del rol asignado"
    (actionClick)="handleRoleAction($event)"
  ></app-ui-table>
</article>

<app-ui-modal
  [open]="showAddRoleForm"
  [title]="roleModalTitle"
  [subtitle]="roleModalSubtitle"
  icon="fa-solid fa-shield-halved"
  size="lg"
  (closeRequested)="cancelarRol.emit()"
>
  <div modal-body class="role-modal-body" [formGroup]="rolForm">
    <div class="ui-grid role-modal-grid">
      <div class="ui-col-6">
        <app-ui-select
          formControlName="rolId"
          label="Rol"
          placeholder="Seleccione un rol"
          [options]="rolOptions"
          [disabled]="editingRole !== null"
          [required]="true"
          [error]="getRoleError('rolId')"
        ></app-ui-select>
      </div>

      <div class="ui-col-6">
        <app-ui-input
          formControlName="fechaFin"
          label="Fecha fin"
          type="date"
          icon="fa-solid fa-calendar-days"
          [required]="true"
          [error]="getRoleError('fechaFin')"
        ></app-ui-input>
      </div>

      <div class="ui-col-12">
        <app-ui-input
          formControlName="justificacion"
          label="Justificación"
          placeholder="Motivo de la asignación"
          [maxlength]="500"
          [rows]="3"
          [multiline]="true"
          [required]="true"
          [error]="getRoleError('justificacion')"
        ></app-ui-input>
      </div>
    </div>
  </div>

  <div modal-actions class="role-modal-actions">
    <app-ui-button
      type="button"
      variant="secondary"
      icon="fa-solid fa-ban"
      [disabled]="savingRole"
      (buttonClick)="cancelarRol.emit()"
    >
      Cancelar
    </app-ui-button>

    <app-ui-button
      type="button"
      variant="primary"
      icon="fa-solid fa-floppy-disk"
      [disabled]="savingRole || rolForm.invalid"
      [loading]="savingRole"
      (buttonClick)="guardarRol.emit()"
    >
      {{ savingRole ? 'Guardando...' : editingRole ? 'Actualizar cambios' : 'Guardar rol' }}
    </app-ui-button>
  </div>
</app-ui-modal>
