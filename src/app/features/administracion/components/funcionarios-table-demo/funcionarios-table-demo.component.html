<app-ui-table
  title="Listado de funcionarios"
  titleIcon="fa-solid fa-list"
  emptyMessage="No hay funcionarios para mostrar con los filtros aplicados."
  [columns]="columns"
  [rows]="funcionariosPaginados()"
  [filters]="filters"
  dataMode="external"
  [actions]="actions"
  [total]="totalFuncionarios()"
  [page]="currentPage()"
  [pageSize]="pageSize()"
  [pageSizeOptions]="pageSizeOptions"
  (filterChange)="onFiltersChange($event)"
  (sortChange)="onSortChange($event)"
  (actionClick)="onActionClick($event)"
  (pageChange)="onPageChange($event)"
  (pageSizeChange)="onPageSizeChange($event)"
></app-ui-table>
