<div class="slider-wrapper">
  <div class="main-slider" [style.aspect-ratio]="activeAspectRatio">
    @for (banner of banners; track banner; let i = $index) {
      <div
        class="slide-item"
        [class.active]="i === currentBannerIndex"
        >
        <img
          class="slide-image"
          [src]="getBannerImageUrl(banner)"
          [alt]="banner.titulo || 'Banner institucional'"
          [attr.fetchpriority]="i === 0 ? 'high' : null"
          decoding="async"
          draggable="false"
          (load)="onImageLoad(i, $event)"
          />
      </div>
    }

    @if (banners.length > 1) {
      <button
        class="slider-arrow slider-arrow--previous"
        type="button"
        aria-label="Mostrar banner anterior"
        (click)="previous.emit()"
        >
        <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
      </button>
      <button
        class="slider-arrow slider-arrow--next"
        type="button"
        aria-label="Mostrar banner siguiente"
        (click)="next.emit()"
        >
        <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
      </button>
    }

    <div class="slider-controls">
      @for (_ of banners; track _; let i = $index) {
        <button
          type="button"
          [class.active]="i === currentBannerIndex"
          (click)="selectBanner.emit(i)"
          [attr.aria-label]="'Cambiar a banner ' + (i + 1)"
        ></button>
      }
    </div>
  </div>
</div>
