<section class="stats" aria-label="Resumen operativo">
  <article class="stat stat--blue">
    <span class="stat__icon"><i class="fa-solid fa-users" aria-hidden="true"></i></span>
    <div>
      <strong>{{ stats().usuariosActivos | number }}</strong>
      <span>Usuarios activos</span>
    </div>
    <small>Sesiones vigentes</small>
  </article>

  <article class="stat stat--green">
    <span class="stat__icon"><i class="fa-solid fa-file-circle-check" aria-hidden="true"></i></span>
    <div>
      <strong>{{ stats().reportesGenerados | number }}</strong>
      <span>Reportes del mes</span>
    </div>
    <small>Gestión registrada</small>
  </article>

  <article class="stat stat--amber">
    <span class="stat__icon"><i class="fa-solid fa-clock" aria-hidden="true"></i></span>
    <div>
      <strong>{{ stats().alertasSistema | number }}</strong>
      <span>Roles por vencer</span>
    </div>
    <small>Próximos 7 días</small>
  </article>
</section>
