<main class="home">
  <!-- El banner conserva su componente y comportamiento existente. -->
  <div class="home__banner">
    <app-home-banner-slider
      [banners]="banners()"
      [currentBannerIndex]="currentBannerIndex()"
      [activeAspectRatio]="getActiveBannerAspectRatio()"
      (previous)="showPreviousBanner()"
      (next)="showNextBanner()"
      (selectBanner)="goToBanner($event)"
      (bannerImageLoad)="onBannerImageLoad($event.index, $event.event)"
    ></app-home-banner-slider>
  </div>

  @if (isMobile()) {
    <!-- En móvil el reproductor permanece inmediatamente debajo del banner. -->
    <app-radio-player class="home__mobile-radio" variant="mobile"></app-radio-player>
  }

  <div class="home__content">
    <app-home-stats [stats]="stats()"></app-home-stats>

    <!-- Noticias conserva una franja independiente y todo el ancho disponible. -->
    <app-home-news-feed
      [items]="news()"
      [likedIds]="likedNewsIds()"
      (likeRequested)="likeNews($event)"
    ></app-home-news-feed>

    <!-- Los videos y la línea de mando comparten una franja secundaria en escritorio. -->
    <div class="home__institutional-layout">
      <app-home-media-panel
        [unitVideoUrl]="unitVideoUrl()"
        [institutionalVideoUrl]="institutionalVideoUrl()"
      ></app-home-media-panel>

      <app-home-command-line [members]="commandLine()"></app-home-command-line>
    </div>
  </div>
</main>
