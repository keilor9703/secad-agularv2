<div
  class="search-field"
  [class.search-field--focused]="focused"
  [class.search-field--invalid]="error"
  [class.search-field--disabled]="isDisabled"
>
  <span class="search-field__label" *ngIf="label">
    {{ label }} <strong *ngIf="required">*</strong>
  </span>

  <div class="search-field__shell" [class.search-field__shell--without-button]="!showButton()">
    <i
      *ngIf="!showButton() && icon"
      [class]="'search-field__leading-icon ' + icon"
      aria-hidden="true"
    ></i>

    <input
      class="search-field__input"
      [id]="inputId"
      type="text"
      [placeholder]="placeholder"
      [disabled]="isDisabled"
      [attr.maxlength]="maxlength"
      [attr.aria-label]="ariaLabel || (!label ? placeholder : null)"
      [attr.aria-required]="required"
      [attr.aria-describedby]="describedBy"
      [attr.aria-invalid]="!!error"
      [value]="value"
      (input)="handleInput($event)"
      (focus)="handleFocus()"
      (blur)="handleBlur()"
      (keydown.enter)="emitSearch()"
    />

    <button
      class="search-field__clear"
      type="button"
      *ngIf="clearable && value"
      [disabled]="isDisabled"
      (click)="clear()"
      title="Limpiar"
    >
      ×
    </button>

    <button
      *ngIf="showButton()"
      class="search-field__button"
      [class.search-field__button--icon-only]="iconOnly"
      [class.search-field__button--mobile-icon-only]="hideButtonTextOnMobile()"
      type="button"
      [disabled]="isDisabled"
      [title]="searchLabel"
      [attr.aria-label]="iconOnly || hideButtonTextOnMobile() ? searchLabel : null"
      (click)="emitSearch()"
    >
      <i [class]="icon" *ngIf="icon"></i>
      <span *ngIf="!iconOnly">{{ buttonText }}</span>
    </button>
  </div>

  <small class="search-field__error" *ngIf="error" [id]="inputId + '-error'">{{ error }}</small>
  <small class="search-field__hint" *ngIf="hint && !error" [id]="inputId + '-hint'">
    {{ hint }}
  </small>
</div>
