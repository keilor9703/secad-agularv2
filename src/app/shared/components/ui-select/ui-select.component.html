<div
  class="form-select"
  [class.form-select--open]="opened"
  [class.form-select--filled]="value !== null"
  [class.form-select--invalid]="error"
  [class.form-select--disabled]="isDisabled"
  [class.form-select--label-floating]="labelMode() === 'floating'"
  [class.form-select--label-active]="labelMode() === 'floating' && (opened || value !== null)"
>
  @if (label) {
    <span class="form-select__label" [id]="inputId + '-label'">
      {{ label }}
      @if (required && showRequiredMarker()) {
        <strong
          class="form-select__required-marker"
          [class.is-invalid]="!!error"
          aria-hidden="true"
        >
          *
        </strong>
      }
    </span>
  }

  <button
    #trigger
    cdkOverlayOrigin
    #origin="cdkOverlayOrigin"
    class="form-select__control"
    [class.form-select__control--with-clear]="clearable && value !== null"
    type="button"
    role="combobox"
    aria-haspopup="listbox"
    [id]="inputId"
    [disabled]="isDisabled"
    [attr.aria-expanded]="opened"
    [attr.aria-controls]="opened ? inputId + '-listbox' : null"
    [attr.aria-labelledby]="label ? inputId + '-label' : null"
    [attr.aria-describedby]="describedBy"
    [attr.aria-required]="required"
    [attr.aria-invalid]="!!error"
    (click)="toggle()"
    (keydown)="handleKeydown($event)"
  >
    <span
      class="form-select__value"
      [class.is-placeholder]="!selectedLabel"
      [title]="selectedLabel || placeholder"
    >
      {{ selectedLabel || placeholder }}
    </span>

    @if (clearable && value !== null) {
      <span class="form-select__clear" (click)="clear($event)"> × </span>
    }

    <span class="form-select__arrow"></span>
  </button>

  <ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayOrigin]="origin"
    [cdkConnectedOverlayOpen]="opened"
    [cdkConnectedOverlayPositions]="panelPositions"
    [cdkConnectedOverlayWidth]="panelWidth()"
    [cdkConnectedOverlayPush]="true"
    [cdkConnectedOverlayFlexibleDimensions]="true"
    [cdkConnectedOverlayViewportMargin]="8"
    [cdkConnectedOverlayHasBackdrop]="true"
    cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
    (attach)="onPanelAttached()"
    (backdropClick)="close()"
    (detach)="close()"
    (positionChange)="onPanelPositionChange($event)"
  >
    <div
      class="form-select__panel"
      role="listbox"
      [id]="inputId + '-listbox'"
      [attr.aria-label]="label || placeholder"
      [class.form-select__panel--above]="panelPlacement() === 'above'"
      [class.is-positioned]="panelPositioned()"
    >
      @if (searchable) {
        <input
          class="form-select__search"
          type="text"
          [placeholder]="searchPlaceholder"
          [value]="searchTerm"
          (input)="onSearch($event)"
        />
      }
      @for (option of filteredOptions; track trackOption($index, option)) {
        <button
          class="form-select__option"
          type="button"
          role="option"
          [disabled]="option.disabled"
          [class.is-selected]="isSelected(option)"
          [attr.aria-selected]="isSelected(option)"
          (click)="selectOption(option)"
        >
          <!-- El espacio del icono siempre existe para que el texto use la columna correcta. -->
          <i
            class="fa-solid fa-check form-select__option-check"
            [class.is-visible]="isSelected(option)"
            aria-hidden="true"
          ></i>
          <span class="form-select__option-label" [title]="option.label">{{ option.label }}</span>
        </button>
      }
      @if (filteredOptions.length === 0) {
        <div class="form-select__empty">Sin resultados.</div>
      }
    </div>
  </ng-template>

  @if (error) {
    <small class="form-select__error" [id]="inputId + '-error'">{{ error }}</small>
  }
  @if (hint && !error) {
    <small class="form-select__hint" [id]="inputId + '-hint'">{{ hint }}</small>
  }
</div>
