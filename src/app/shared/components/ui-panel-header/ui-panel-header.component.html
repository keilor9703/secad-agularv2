<header
  class="ui-panel-header"
  [class.is-institutional]="appearance() === 'institutional'"
  [class.is-soft]="appearance() === 'soft'"
>
  @if (icon()) {
    <span class="ui-panel-header__icon" aria-hidden="true">
      <i [class]="icon()"></i>
    </span>
  }

  <div class="ui-panel-header__content">
    <h3 [id]="headingId()">{{ title() }}</h3>
    @if (description()) {
      <p>{{ description() }}</p>
    }
  </div>

  <div class="ui-panel-header__actions">
    <ng-content select="[panel-header-actions]"></ng-content>
  </div>
</header>
