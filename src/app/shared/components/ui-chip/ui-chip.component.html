<span
  class="ui-status-chip"
  [class]="
    'ui-status-chip ui-status-chip--' +
    variant() +
    ' ui-status-chip--' +
    appearance() +
    ' ui-status-chip--' +
    size()
  "
  [class.is-disabled]="disabled()"
  [attr.aria-label]="ariaLabel()"
>
  @if (dot()) {
    <span class="ui-status-chip__dot" aria-hidden="true"></span>
  } @else if (icon()) {
    <i [class]="icon()" aria-hidden="true"></i>
  }

  <span class="ui-status-chip__label">
    @if (value() !== null && value() !== '') {
      <strong class="ui-status-chip__value">{{ value() }}</strong>
    }
    @if (label()) {
      {{ label() }}
    } @else {
      <ng-content />
    }
  </span>

  @if (removable()) {
    <button
      class="ui-status-chip__remove"
      type="button"
      [disabled]="disabled()"
      [attr.aria-label]="'Quitar ' + (label() || 'elemento')"
      (click)="requestRemove()"
    >
      <i class="fa-solid fa-xmark" aria-hidden="true"></i>
    </button>
  }
</span>
