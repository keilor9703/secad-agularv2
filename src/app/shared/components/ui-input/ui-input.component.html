<label
  class="form-field"
  [class.form-field--focused]="focused"
  [class.form-field--filled]="shouldFloat"
  [class.form-field--invalid]="error"
  [class.form-field--disabled]="isDisabled"
  [class.form-field--multiline]="multiline"
>
  <span class="form-field__label" *ngIf="label">
    {{ label }}
    @if (required && showRequiredMarker()) {
      <strong class="form-field__required-marker" [class.is-invalid]="!!error" aria-hidden="true">
        *
      </strong>
    }
  </span>

  <span class="form-field__control">
    <textarea
      *ngIf="multiline; else singleInput"
      class="form-field__native"
      [id]="inputId"
      [rows]="rows"
      [placeholder]="placeholder"
      [readonly]="readonly"
      [disabled]="isDisabled"
      [attr.maxlength]="maxlength"
      [attr.aria-required]="required"
      [attr.aria-describedby]="describedBy"
      [attr.aria-invalid]="!!error"
      [value]="value"
      (input)="handleInput($event)"
      (focus)="handleFocus()"
      (blur)="handleBlur()"
    ></textarea>

    <ng-template #singleInput>
      <input
        class="form-field__native"
        [id]="inputId"
        [type]="type"
        [placeholder]="placeholder"
        [autocomplete]="autocomplete"
        [readonly]="readonly"
        [disabled]="isDisabled"
        [attr.maxlength]="maxlength"
        [attr.aria-required]="required"
        [attr.aria-describedby]="describedBy"
        [attr.aria-invalid]="!!error"
        [value]="value"
        (input)="handleInput($event)"
        (focus)="handleFocus()"
        (blur)="handleBlur()"
        (keydown.enter)="handleEnter()"
      />
    </ng-template>

    <i class="form-field__icon" [class]="icon" *ngIf="icon"></i>
  </span>

  <small class="form-field__error" *ngIf="error" [id]="inputId + '-error'">{{ error }}</small>
  <small class="form-field__hint" *ngIf="hint && !error" [id]="inputId + '-hint'">{{ hint }}</small>
</label>
