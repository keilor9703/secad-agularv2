<div class="table-pagination">
  <span class="pagination-summary" *ngIf="showSummary">
    Mostrando {{ startItem }} - {{ endItem }} de {{ total }}
  </span>

  <div class="pagination-actions">
    <button class="ui-btn secondary sm" type="button" [disabled]="page <= 1" (click)="goToPage(page - 1)">
      <i class="fa-solid fa-chevron-left"></i>
      Anterior
    </button>

    <span class="pagination-page">Página {{ page }} de {{ totalPages }}</span>

    <button
      class="ui-btn secondary sm"
      type="button"
      [disabled]="page >= totalPages"
      (click)="goToPage(page + 1)"
    >
      Siguiente
      <i class="fa-solid fa-chevron-right"></i>
    </button>
  </div>
</div>
