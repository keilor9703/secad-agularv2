<aside
  class="sidebar"
  [class.sidebar--open]="isOpen()"
  [attr.aria-label]="isOpen() ? 'Menú principal expandido' : 'Menú principal compacto'"
>
  <!-- En modo compacto solo se muestra el disparador del menú. -->
  <header class="sidebar__header">
    @if (isOpen()) {
      <!-- El PNG ocupa el lugar principal del encabezado, sin marcos ni cápsulas. -->
      <a
        class="sidebar__brand"
        [class.sidebar__brand--logo-right]="identity().menuLogoPosition === 'right'"
        routerLink="/home"
        (click)="onNavigate()"
      >
        @if (identity().menuShowLogo) {
          <img
            class="sidebar__logo"
            [src]="identity().logoUrl"
            [alt]="'Logo de ' + identity().institutionName"
            [style.width.px]="identity().menuLogoSizePx"
            [style.height.px]="identity().menuLogoSizePx"
            [style.flex-basis.px]="identity().menuLogoSizePx"
          />
        }

        @if (brandTextItems().length > 0) {
          <span
            class="sidebar__brand-copy"
            [class.sidebar__brand-copy--inline]="identity().menuTextLayout === 'inline'"
            [class.sidebar__brand-copy--center]="identity().menuTextAlign === 'center'"
            [class.sidebar__brand-copy--right]="identity().menuTextAlign === 'right'"
          >
            @for (item of brandTextItems(); track item.kind) {
              <span
                class="sidebar__brand-text"
                [class.sidebar__brand-text--institution]="item.kind === 'institution'"
                [class.sidebar__brand-text--system]="item.kind === 'system'"
                [class.sidebar__brand-text--acronym]="item.kind === 'acronym'"
                [style.font-size.px]="item.sizePx"
              >
                {{ item.text }}
              </span>
            }
          </span>
        }
      </a>

      <button
        class="sidebar__collapse"
        type="button"
        (click)="toggleSidebar()"
        aria-controls="primary-navigation"
        aria-label="Contraer menú principal"
        title="Contraer menú"
      >
        <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
      </button>
    } @else {
      <button
        class="sidebar__toggle"
        type="button"
        (click)="toggleSidebar()"
        aria-controls="primary-navigation"
        aria-label="Expandir menú principal"
        title="Expandir menú"
      >
        <i class="fa-solid fa-bars" aria-hidden="true"></i>
      </button>
    }
  </header>

  <nav id="primary-navigation" class="sidebar__scroll" aria-label="Secciones del sistema">
    <ul class="sidebar__list">
      @for (item of menuItems(); track item.id) {
        <app-sidebar-menu-node
          [item]="item"
          [sidebarOpen]="isOpen()"
          [expandedIds]="expandedItemIds()"
          [currentUrl]="currentUrl()"
          (toggleRequested)="toggleGroup($event)"
          (navigateRequested)="onNavigate()"
        />
      } @empty {
        @if (isOpen()) {
          <li class="sidebar__empty">
            <i class="fa-solid fa-circle-notch fa-spin" aria-hidden="true"></i>
            <span>Cargando navegación…</span>
          </li>
        }
      }
    </ul>
  </nav>

  <footer class="sidebar__user" aria-label="Sesión">
    <div class="sidebar__actions">
      <button
        class="sidebar-action sidebar-action--logout"
        type="button"
        aria-label="Cerrar sesión"
        title="Cerrar sesión"
        (click)="logout()"
      >
        <i class="sidebar-action__icon fa-solid fa-arrow-right-from-bracket" aria-hidden="true"></i>
      </button>
    </div>
  </footer>
</aside>
