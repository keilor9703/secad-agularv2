<header class="modern-header">
  <button
    class="mobile-menu-trigger"
    type="button"
    (click)="toggleMobileMenu()"
    [attr.aria-expanded]="sidebarOpen()"
    aria-controls="primary-navigation"
    [attr.aria-label]="sidebarOpen() ? 'Cerrar menú principal' : 'Abrir menú principal'"
  >
    <i
      class="fa-solid"
      [class.fa-bars]="!sidebarOpen()"
      [class.fa-xmark]="sidebarOpen()"
      aria-hidden="true"
    ></i>
  </button>

  <div class="header-search">
    <input
      type="text"
      placeholder="Buscar..."
      [(ngModel)]="searchQuery"
      (keyup.enter)="onSearch()"
      class="search-input"
    />
    <button class="search-btn" type="button" (click)="onSearch()" aria-label="Buscar">
      <i class="fa-solid fa-search" aria-hidden="true"></i>
    </button>
  </div>

  <div class="header-actions">
    <!-- Sólo pinta algo para el superadministrador. -->
    <app-topbar-tenant-switcher></app-topbar-tenant-switcher>
    <app-topbar-notifications></app-topbar-notifications>
    <app-topbar-user-menu></app-topbar-user-menu>
  </div>
</header>
