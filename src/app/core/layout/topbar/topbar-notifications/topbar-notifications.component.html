<div class="topbar-notifications" aria-label="Notificaciones y eventos">
  <div class="notification-wrapper" *ngFor="let notif of notifications">
    <button
      class="notification-btn"
      type="button"
      [ngClass]="'notification-' + notif.color"
      [attr.aria-expanded]="notif.id === 4 ? isCalendarDropdownOpen : null"
      [attr.aria-label]="notif.tooltip"
      [title]="notif.tooltip"
      (click)="onNotificationClick(notif, $event)"
    >
      <i [class]="'fa-solid ' + notif.icon" aria-hidden="true"></i>
      <span class="notification-badge" *ngIf="notif.count > 0">
        {{ notif.count > 9 ? '9+' : notif.count }}
      </span>
    </button>

    <div class="events-dropdown" *ngIf="notif.id === 4 && isCalendarDropdownOpen">
      <div class="dropdown-header">
        <span>Próximos Eventos</span>
        <i class="fa-solid fa-calendar-day" aria-hidden="true"></i>
      </div>

      <div class="dropdown-list" *ngIf="proximosEventos.length > 0; else noEvents">
        <button
          class="event-item"
          type="button"
          *ngFor="let ev of proximosEventos"
          (click)="openEventoDetail(ev, $event)"
        >
          <span class="event-item__info">
            <span class="event-item__name">{{ ev.nombreEvento }}</span>
            <span class="event-item__date">{{ getEventoFechaRango(ev) }}</span>
          </span>
          <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
        </button>
      </div>

      <ng-template #noEvents>
        <div class="dropdown-empty">No hay eventos próximos</div>
      </ng-template>
    </div>
  </div>
</div>

<div class="modal-backdrop" *ngIf="isEventoModalOpen" (click)="closeEventoModal()">
  <section class="event-detail-modal" (click)="$event.stopPropagation()" role="dialog" aria-modal="true">
    <header class="event-detail-modal__head">
      <h3>Detalle del Evento</h3>
      <button type="button" class="modal-close" (click)="closeEventoModal()" aria-label="Cerrar">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </header>

    <div class="event-detail-modal__body" *ngIf="selectedEvento as ev">
      <h4 class="event-detail-title">{{ ev.nombreEvento }}</h4>

      <div class="event-detail-img-container" *ngIf="getEventoImageUrl(ev.imagenEvento) as imgUrl">
        <img [src]="imgUrl" [alt]="ev.nombreEvento" class="event-detail-img" />
      </div>

      <dl class="event-detail-list">
        <div>
          <dt><i class="fa-regular fa-calendar-days" aria-hidden="true"></i> Fecha</dt>
          <dd>{{ getEventoFechaRango(ev) }}</dd>
        </div>
        <div>
          <dt><i class="fa-solid fa-location-dot" aria-hidden="true"></i> Lugar</dt>
          <dd>{{ ev.direccionEvento || 'Sin información' }}</dd>
        </div>
        <div>
          <dt><i class="fa-solid fa-building" aria-hidden="true"></i> Ciudad</dt>
          <dd>{{ ev.ciudad }} - {{ ev.departamento }}</dd>
        </div>
        <div>
          <dt><i class="fa-solid fa-user-tie" aria-hidden="true"></i> Responsable</dt>
          <dd>{{ ev.nombreResponsable || 'Sin información' }}</dd>
        </div>
      </dl>
    </div>
  </section>
</div>
