<div
  class="app-shell"
  [class.menu-open]="isMenuOpen()"
  [class.mobile-navigation-active]="isMobile()"
>
  <app-sidebar class="app-sidebar"></app-sidebar>

  @if (isMenuOpen()) {
    <div class="app-backdrop" (click)="closeMenu()" aria-hidden="true"></div>
  }

  <div class="shell">
    <app-topbar></app-topbar>

    <main class="main">
      <app-breadcrumb></app-breadcrumb>

      <div class="content">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>

  @if (isMobile()) {
    <!-- Navegación compacta exclusiva para teléfonos y tabletas pequeñas. -->
    <app-mobile-bottom-nav></app-mobile-bottom-nav>
  } @else {
    <!-- El footer completo se conserva únicamente para escritorio. -->
    <app-footer class="app-footer-fixed"></app-footer>
  }
</div>

<!-- Menú de accesibilidad flotante. -->
@if (!isMobile()) {
  <!-- En escritorio se conserva el menú completo; móvil usa el icono junto al perfil. -->
  <app-accessibility-menu [socialGroups]="socialGroups"></app-accessibility-menu>
}
